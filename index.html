function food(id){return DB.find(x=>x.id===id)}
function chooseRecommended(ids, age){
 // 후보 재료 중 영양적 역할의 균형을 고려해 4~5개를 고릅니다.
 // 규칙 기반 참고 추천이며, 임상 검증 또는 개별 영양 처방은 아닙니다.
 const unique=[...new Set(ids)].filter(id=>food(id));
 const chosen=[]; const add=id=>{if(id&&!chosen.includes(id))chosen.push(id)};
 const pickBest=(list,score)=>list.filter(id=>unique.includes(id)).sort((a,b)=>score(b)-score(a))[0];
 const grains=["rice","brownrice","glutinousrice","oat","barley","millet","quinoa","wheat"];
 const starch=["potato","sweetpotato","pumpkin"];
 const ironProtein=["beef","lamb","pork","chicken","turkey","duck","lentil","tofu","egg","salmon","cod","pollock","mackerel","anchovy","chickpea","bean","peanut","sesame","almond"];
 const vegetables=["broccoli","zucchini","bokchoy","vitamin","cauliflower","spinach","cabbage","kale","carrot","onion","leek","mushroom","shiitake","eggplant","cucumber","tomato","redpepper","asparagus","beet","greenpea","greenbean","lotusroot"];
 const fruit=["pear","apple","banana","avocado","blueberry","strawberry","peach","plum","mango","kiwi","melon","orange","prune"];
 const oils=["oliveoil","canolaoil"];
 // 우선 곡류 1종. 보유한 곡류가 없을 때만 전분성 채소를 탄수화물원으로 사용.
 add(pickBest(grains,id=>{const f=food(id);return f.iron*3+f.protein*.5+f.kcal/100}));
 if(!chosen.length) add(pickBest(starch,id=>food(id).kcal/100+food(id).carb/10));
 // 철분 공급원 우선: 소고기 등 육류의 철분과 단백질을 높게 평가하되 식품군의 다양성을 고려.
 add(pickBest(ironProtein,id=>{
   const f=food(id), cat=f.cat;
   const heme=["beef","lamb","pork","duck"].includes(id)?1.5:0;
   return f.iron*2.2+f.protein*.25+heme;
 }));
 // 채소는 서로 다른 재료 2종을 선택. 브로콜리·토마토·파프리카 등은 비타민 C 공급원 후보로 우선.
 const vegScore=id=>{const f=food(id);const vitaminC=["broccoli","tomato","redpepper","cauliflower","kale"].includes(id)?1.4:0;return f.iron*.5+f.protein*.2+vitaminC};
 for(const id of vegetables.sort((a,b)=>vegScore(b)-vegScore(a))){if(unique.includes(id)&&chosen.length<4)add(id)}
 // 선택 가능한 재료가 부족한 경우, 이미 선택된 재료와 역할이 겹치지 않는 후보로 보완.
 if(chosen.length<4){
   const extras=unique.filter(id=>!chosen.includes(id)&&!oils.includes(id)&&!["milk","cheese","yogurt","chia","flax"].includes(id));
   extras.sort((a,b)=>{
     const role=id=>{const f=food(id);if(grains.includes(id)||starch.includes(id))return "carb";if(ironProtein.includes(id))return "protein";if(vegetables.includes(id))return "veg";return f.cat};
     const diversity=id=>chosen.some(x=>role(x)===role(id))?-1:1;
     return diversity(b)-diversity(a)+(food(b).iron-food(a).iron)*.1;
   });
   for(const id of extras){if(chosen.length>=4)break;add(id)}
 }
 // 다섯 번째는 가능할 때 다른 채소, 없으면 과일을 소량 보조 재료로 선택.
 if(chosen.length<5){
   const extra=vegetables.find(id=>unique.includes(id)&&!chosen.includes(id))||fruit.find(id=>unique.includes(id)&&!chosen.includes(id));
   if(extra)add(extra);
 }
 return chosen.slice(0,5);
}
function amountFor(ids,target){
 // 4~5개 후보에 대한 계산 예시 비율. 공식 월령별 권장량이나 검증된 처방이 아닙니다.
 const groups={
   grain:ids.filter(id=>food(id).cat==="곡류"),
   starch:ids.filter(id=>food(id).role==="전분성 채소"),
   protein:ids.filter(id=>["육류·단백질","생선","달걀·콩·견과"].includes(food(id).cat)),
   veg:ids.filter(id=>food(id).cat==="채소"&&food(id).role!=="전분성 채소"),
   fruit:ids.filter(id=>food(id).cat==="과일"),
   other:ids.filter(id=>["유제품","유지·씨앗"].includes(food(id).cat))
 };
 // 목표 중량을 식품군 역할에 따라 나누고, 그룹 내 여러 재료는 균등 배분.
 // 전분성 채소는 곡류와 같은 탄수화물 역할이므로 별도 그룹으로 나누어 과다 중복을 피함.
 const weights={grain:0.38,starch:0.25,protein:0.30,veg:0.25,fruit:0.10,other:0.05};
 const active=Object.keys(groups).filter(k=>groups[k].length);
 let totalW=active.reduce((n,k)=>n+weights[k],0);
 const result={};
 active.forEach(k=>{
   const groupW=(weights[k]/totalW)*target;
   const each=groupW/groups[k].length;
   groups[k].forEach(id=>result[id]=Math.max(5,Math.round(each/5)*5));
 });
 const total=Object.values(result).reduce((a,b)=>a+b,0);
 if(ids.length)result[ids[0]]+=target-total;
 return result;
}
function nutrients(amounts){
 let n={kcal:0,protein:0,iron:0,carb:0};Object.entries(amounts).forEach(([id,g])=>{let f=food(id),ratio=g/100;n.kcal+=f.kcal*ratio;n.protein+=f.protein*ratio;n.iron+=f.iron*ratio;n.carb+=f.carb*ratio});return n;
}

}
function renderRecipes(v){v.innerHTML=`<section class="panel wide"><h2>📒 저장한 레시피</h2><p class="muted">레시피는 이 기기의 브라우저에 저장됩니다.</p>${state.recipes.length?state.recipes.map(r=>`<div class="item"><div class="item-head"><span class="item-title">${esc(r.name)}</span><button class="secondary small" data-del="${r.id}">삭제</button></div><p>${r.age}개월 기준 · 목표 ${r.target}g · ${new Date(r.created).toLocaleDateString("ko-KR")}</p><p>${Object.entries(r.amounts).map(([id,g])=>`${food(id)?.name||id} ${g}g`).join(" · ")}</p><button class="small" data-shop="${r.id}">재료 장보기 추가</button></div>`).join(""):'<div class="empty">아직 저장한 레시피가 없어요. 배합 결과에서 저장해 주세요.</div>'}</section>`;v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.recipes=state.recipes.filter(r=>r.id!=b.dataset.del);put("recipes",state.recipes);render()});v.querySelectorAll("[data-shop]").forEach(b=>b.onclick=()=>{let r=state.recipes.find(x=>x.id==b.dataset.shop);Object.keys(r.amounts).forEach(id=>{if(!state.stock[id]||state.stock[id].grams<r.amounts[id]){if(!state.shopping.some(s=>s.id===id))state.shopping.push({id,qty:r.amounts[id]})}});put("shopping",state.shopping);alert("재고가 부족한 재료를 장보기 목록에 추가했어요.");});}
function renderStock(v){v.innerHTML=`<section class="panel wide"><h2>🧊 냉동 큐브 재고</h2><p class="muted">재료별 보유 중량(g)을 기록하세요. 큐브 크기가 다르면 총중량으로 입력하면 됩니다.</p><div class="grid2"><div><label>재료</label><select id="stockFood">${DB.map(f=>`<option value="${f.id}">${f.name}</option>`).join("")}</select></div><div><label>추가 중량(g)</label><input id="stockGrams" type="number" min="1" value="20"></div></div><button id="addStock" style="margin-top:10px">재고 추가</button><h3>현재 재고</h3>${Object.keys(state.stock).filter(id=>state.stock[id].grams>0).length?Object.entries(state.stock).filter(([id,x])=>x.grams>0).map(([id,x])=>`<div class="item"><div class="item-head"><span>${food(id)?.name||id}</span><b>${x.grams}g</b></div><div class="row" style="margin-top:8px"><button class="secondary small" data-use="${id}">20g 사용</button><button class="secondary small" data-remove="${id}">재고 삭제</button></div></div>`).join(""):'<div class="empty">등록된 재고가 없어요.</div>'}</section>`;$("#addStock").onclick=()=>{let id=$("#stockFood").value,g=Number($("#stockGrams").value);if(g>0){state.stock[id]??={grams:0};state.stock[id].grams+=g;put("stock",state.stock);render()}};v.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{let x=state.stock[b.dataset.use];x.grams=Math.max(0,x.grams-20);put("stock",state.stock);render()});v.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{delete state.stock[b.dataset.remove];put("stock",state.stock);render()});}
function renderAllergy(v){v.innerHTML=`<section class="panel wide"><h2>🩷 알레르기·도입 기록</h2><p class="muted">의료 진단을 대신하지 않습니다. 심한 반응이 있었다면 재도입하지 말고 의료진에게 상담하세요.</p><div class="field"><label>식품</label><select id="allFood">${DB.map(f=>`<option value="${f.id}">${f.name}${f.allergen?" · "+f.allergen:""}</option>`).join("")}<option value="other">기타 식품</option></select></div><div class="field"><label>도입 상태</label><select id="allStatus"><option>먹어 봄 · 반응 없음</option><option>처음 도입 예정</option><option>반응 의심</option><option>의료진 진단 알레르기</option></select></div><div class="field"><label>날짜</label><input id="allDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>메모(먹은 양, 증상, 대처 등)</label><textarea id="allNote" rows="2" placeholder="예: 입 주변 발진이 10분 뒤 나타남"></textarea></div><button id="addAll">기록 저장</button><h3>기록 목록</h3>${state.allergies.length?state.allergies.map(a=>`<div class="item"><div class="item-head"><b>${esc(food(a.food)?.name||a.foodName||"기타 식품")}</b><span class="pill">${esc(a.status)}</span></div><p>${esc(a.date)} · ${esc(a.note||"메모 없음")}</p><button class="ghost small" data-delall="${a.id}">삭제</button></div>`).join(""):'<div class="empty">아직 기록이 없어요.</div>'}</section>`;$("#addAll").onclick=()=>{let f=$("#allFood").value;state.allergies.unshift({id:Date.now(),food:f,foodName:f==="other"?"기타 식품":"",status:$("#allStatus").value,date:$("#allDate").value,note:$("#allNote").value.trim()});put("allergies",state.allergies);render()};v.querySelectorAll("[data-delall]").forEach(b=>b.onclick=()=>{state.allergies=state.allergies.filter(a=>a.id!=b.dataset.delall);put("allergies",state.allergies);render()});}
function renderShopping(v){v.innerHTML=`<section class="panel wide"><h2>🛒 장보기 목록</h2><div class="row"><div><label>재료</label><select id="shopFood">${DB.map(f=>`<option value="${f.id}">${f.name}</option>`).join("")}</select></div><div><label>필요 중량(g)</label><input id="shopQty" type="number" min="1" value="100"></div></div><button id="addShop" style="margin-top:10px">목록에 추가</button><h3>살 재료</h3>${state.shopping.length?state.shopping.map((s,i)=>`<div class="item"><div class="item-head"><label style="margin:0;display:flex;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" data-bought="${i}" ${s.bought?"checked":""}>${esc(food(s.id)?.name||s.id)}</label><b>${s.qty}g</b></div><button class="ghost small" data-delshop="${i}">삭제</button></div>`).join(""):'<div class="empty">장보기 목록이 비어 있어요.</div>'}<button class="secondary" id="clearBought" style="margin-top:10px">구매 완료 항목 정리</button></section>`;$("#addShop").onclick=()=>{let id=$("#shopFood").value,qty=Number($("#shopQty").value);if(qty>0){let old=state.shopping.find(s=>s.id===id&&!s.bought);if(old)old.qty+=qty;else state.shopping.push({id,qty,bought:false});put("shopping",state.shopping);render()}};v.querySelectorAll("[data-bought]").forEach(c=>c.onchange=()=>{state.shopping[+c.dataset.bought].bought=c.checked;put("shopping",state.shopping)});v.querySelectorAll("[data-delshop]").forEach(b=>b.onclick=()=>{state.shopping.splice(+b.dataset.delshop,1);put("shopping",state.shopping);render()});$("#clearBought").onclick=()=>{state.shopping=state.shopping.filter(s=>!s.bought);put("shopping",state.shopping);render()}}
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b){currentTab=b.dataset.tab;render()}});
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
